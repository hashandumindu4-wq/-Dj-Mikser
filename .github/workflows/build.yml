name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip and Auto-Detect Project Root
      run: |
        find . -maxdepth 1 -name "*.zip" -exec unzip -o {} \;
        TARGET_DIR=$(find . -mindepth 2 -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname 2>/dev/null || true)
        if [ -n "$TARGET_DIR" ]; then
          echo "Found project files in: $TARGET_DIR"
          cp -rn "$TARGET_DIR"/* . 2>/dev/null || true
          cp -rn "$TARGET_DIR"/.* . 2>/dev/null || true
        fi

    - name: Auto-Fix Kotlin Compose Compiler Plugin
      run: |
        python3 -c '
        import os

        target_file = None
        for root, dirs, files in os.walk("."):
            for f in files:
                if f in ["build.gradle", "build.gradle.kts"] and "app" in root:
                    target_file = os.path.join(root, f)
                    break

        if target_file and os.path.exists(target_file):
            with open(target_file, "r") as f:
                content = f.read()

            if "org.jetbrains.kotlin.plugin.compose" not in content:
                print(f"Adding Compose plugin to {target_file}")
                if "plugins {" in content:
                    is_kts = target_file.endswith(".kts")
                    plugin_str = "plugins {\n    id(\"org.jetbrains.kotlin.plugin.compose\") version \"2.0.0\"" if is_kts else "plugins {\n    id \"org.jetbrains.kotlin.plugin.compose\" version \"2.0.0\""
                    content = content.replace("plugins {", plugin_str, 1)
                    with open(target_file, "w") as f:
                        f.write(content)
        '

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DJ-Mixer-App
        path: '**/*.apk'
